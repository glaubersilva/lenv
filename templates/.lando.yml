name: __PROJECT_NAME__
recipe: wordpress

config:
  webroot: .
  php: '8.3'
  database: mysql:8.0
  via: apache
  xdebug: off

proxy:
  appserver:
    - __PROJECT_NAME__.lndo.site
  mailhog:
    - mailhog.__PROJECT_NAME__.lndo.site:80
  phpmyadmin:
    - phpmyadmin.__PROJECT_NAME__.lndo.site:80

services:
  database:
    creds:
      user: admin
      password: admin
      database: wordpress

  appserver:
    run:
      # WP-CLI and Composer are not always provisioned by the wordpress recipe — download on first start
      - test -x /usr/local/bin/wp || (echo "[lenv] Downloading WP-CLI..." && curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /usr/local/bin/wp && chmod +x /usr/local/bin/wp)
      - test -x /usr/local/bin/composer || (echo "[lenv] Downloading Composer..." && curl -fsSL --proto '=https' --tlsv1.2 https://getcomposer.org/download/latest-stable/composer.phar -o /usr/local/bin/composer && chmod +x /usr/local/bin/composer)
      - test -x /usr/local/bin/composer && composer config -g github-oauth.github.com "$GITHUB_TOKEN" || true
      - /bin/sh /app/.lando/ensure-db-creds.sh
    overrides:
      environment:
        # Must match the server name configured in PhpStorm (Settings > PHP > Servers)
        PHP_IDE_CONFIG: "serverName=__PROJECT_NAME__"
        # GitHub token for Composer private packages — set GITHUB_TOKEN in your shell profile
        GITHUB_TOKEN: ${GITHUB_TOKEN}
      volumes:
        - ./.lando/php.ini:/usr/local/etc/php/conf.d/zzzz-lando-xdebug.ini

  # Email capture (replaces real SMTP in dev)
  mailhog:
    type: mailhog
    hogfrom:
      - appserver

  # Database manager
  phpmyadmin:
    type: phpmyadmin
    hosts:
      - database

tooling:
  # lando composer <command> — runs inside the container (correct PHP + extensions)
  composer:
    service: appserver
    cmd: /bin/sh -c 'test -x /usr/local/bin/composer || (echo "[lenv] Downloading Composer..." && curl -fsSL --proto "=https" --tlsv1.2 https://getcomposer.org/download/latest-stable/composer.phar -o /usr/local/bin/composer && chmod +x /usr/local/bin/composer); exec /usr/local/bin/composer "$@"' _
    user: root
    env:
      XDEBUG_MODE: "off"

  # lando wp <command>
  wp:
    service: appserver
    cmd: /bin/sh -c 'test -x /usr/local/bin/wp || (echo "[lenv] Downloading WP-CLI..." && curl -fsSL --proto "=https" --tlsv1.2 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /usr/local/bin/wp && chmod +x /usr/local/bin/wp); exec /usr/local/bin/wp --allow-root "$@"' _

  # Run once after the first `lando start`
  # NOTE: do NOT name this "setup" or "install" — both are reserved Lando commands
  wp-install:
    service: appserver
    description: Download WordPress core and run initial setup
    cmd:
      - test -x /usr/local/bin/wp || (echo "[lenv] Downloading WP-CLI..." && curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /usr/local/bin/wp && chmod +x /usr/local/bin/wp)
      - test -x /usr/local/bin/composer || (echo "[lenv] Downloading Composer..." && curl -fsSL --proto '=https' --tlsv1.2 https://getcomposer.org/download/latest-stable/composer.phar -o /usr/local/bin/composer && chmod +x /usr/local/bin/composer)
      - /bin/sh /app/.lando/ensure-db-creds.sh
      - test -f /app/wp-load.php || /usr/local/bin/wp core download --allow-root --path=/app
      - /usr/local/bin/wp config create --allow-root --path=/app --dbname=wordpress --dbuser=admin --dbpass=admin --dbhost=database --force
      - php /app/.lando/install-wp-config-https.php
      - /usr/local/bin/wp core install --allow-root --path=/app --url=https://__PROJECT_NAME__.lndo.site --title="__PROJECT_NAME__ Dev" --admin_user=admin --admin_password=admin --admin_email=dev@lndo.site --skip-email
      - /usr/local/bin/wp rewrite structure --allow-root --path=/app '/%postname%/'
      - /usr/local/bin/wp config set WP_DEBUG true --raw --allow-root --path=/app
      - /usr/local/bin/wp config set WP_DEBUG_LOG true --raw --allow-root --path=/app
      - /usr/local/bin/wp config set WP_DEBUG_DISPLAY false --raw --allow-root --path=/app
      - /usr/local/bin/wp config set SCRIPT_DEBUG false --raw --allow-root --path=/app

  xdebug-on:
    service: appserver
    description: Enable Xdebug without rebuild.
    cmd: /bin/sh /app/.lando/xdebug-on.sh
    user: root

  xdebug-off:
    service: appserver
    description: Disable Xdebug without rebuild.
    cmd: /bin/sh /app/.lando/xdebug-off.sh
    user: root
